[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-issue-agent"
version = "0.1.0"
description = "Autonomous GitHub issue-to-PR agent"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "PyGithub>=2.4.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=23.2.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "fakeredis>=2.20.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
service = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "rq>=1.16.0",
    "redis>=5.0.0",
]

[project.scripts]
issue-agent = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["workspaces"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
